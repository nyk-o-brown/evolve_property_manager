services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evolve_php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - laravel

  web:
    image: nginx:latest
    container_name: evolve_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: evolve_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: evolve_db
      MYSQL_USER: evolve_user
      MYSQL_PASSWORD: evolve_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

  composer:
    image: composer:2
    container_name: evolve_composer
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - laravel

  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile
    container_name: evolve_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    stdin_open: true
    tty: true
    depends_on:
      - web
    networks:
      - laravel

networks:
  laravel:

volumes:
  db_data:
